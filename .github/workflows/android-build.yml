name: Android CI (APK 자동 빌드)

on:
  push:
    branches: [ "RESCENE_wiget" ] # main 또는 master 브랜치에 코드가 push될 때 작동
  pull_request:
    branches: [ "RESCENE_wiget" ]

jobs:
  build:
    runs-on: ubuntu-latest # GitHub이 제공하는 우분투 가상머신에서 실행

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. JDK 17 설정 (프로젝트 자바 버전에 맞게 수정 가능)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 권한 부여
        run: chmod +x gradlew

      - name: 4. APK 빌드
        run: ./gradlew assembleDebug

      - name: 5. 빌드된 APK 파일 저장 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk # 다운로드받을 때 표시될 이름
          path: app/build/outputs/apk/debug/app-debug.apk # 생성된 APK 위치