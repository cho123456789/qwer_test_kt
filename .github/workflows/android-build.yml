name: Android CI (APK 자동 빌드)

on:
  push:
    branches: [ "RESCENE_wiget" ]
  pull_request:
    branches: [ "RESCENE_wiget" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 권한 부여
        run: chmod +x gradlew

      - name: 4. google-services.json 생성
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: 5. APK 빌드
        run: ./gradlew assembleDebug

      - name: 6. 빌드된 APK 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk